<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="todo-container">
      <h1>My To-Do List</h1>
      <p class="subtitle">Plan your day</p>

      <form id="todo-form">
        <label for="task-input">Task name</label>
        <input
          type="text"
          id="task-input"
          placeholder="What do you need to do today?"
          required
        />

        <label for="task-date">Task date</label>
        <input type="date" id="task-date" />

        <label for="task-time">Task time</label>
        <input type="time" id="task-time" />

        <button type="submit" id="add-button">+ Add Task</button>
      </form>

      <div class="task-summary">
        <span id="task-count">0 tasks</span>
        <span id="completed-count">0 completed</span>
      </div>

      <ul id="task-list"></ul>

      <p id="empty-message">No tasks yet. Add your first task!</p>

      <button type="button" id="clear-button" class="clear-button">
        Delete All
      </button>
    </div>
  </body>
</html>
